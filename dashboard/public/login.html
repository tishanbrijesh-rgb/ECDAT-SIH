</style>

<body>

<script>
// ─── Layout Engine ───────────────────────────────────────
(function(){
var REF_W=1464,REF_H=949,PHOTO_W=836,PANE_W=628,CARD_W=613,CARD_H=922;
var CONTENT_H=697;
var IMG_W=1177,IMG_H=1336,IMG_REF_SCALE=836/1177;
var PANE_RATIO=PANE_W/REF_W;
var HERO_W=681,HERO_H=219;
var REF_CARD_ASPECT=692/855;
var RAMP_HI=1280,RAMP_LO=1000,PHOTO_MIN=0.42;
var RAMP_LO2=820,PHOTO_MIN2=0.36;
var TP={pad:0.1076,h1Top:0.08656,h1Fs:0.06839,subTop:0.17368,subFs:0.0309,emTop:0.25435,emH:0.10257,emR:0.0202,ephFs:0.02702,ephPad:0.0332,pwTop:0.36851,pwH:0.10839,btnTop:0.50435,btnH:0.10981,btnFs:0.0275,arrow:0.026,btnGap:0.02,divTop:0.68222,orFs:0.02245,orPad:0.051,divH:0.0026,gTop:0.76445,gH:0.09966,gIcon:0.032,gtFs:0.03205,gGap:0.026,btTop:0.89668,btFs:0.02876,badgeH:0.0742,heroLh:1.1246,heroBot:0.06493,heroGap:-0.30423,heroSide:0.0525};

function clearInline(){
  var ids=['photo','pane','card','cardIn','hero'];
  ids.forEach(function(id){var el=document.getElementById(id);if(el)el.style.cssText=''});
}

function photoRatio(vw){
  if(vw>=RAMP_HI) return 1-PANE_RATIO;
  if(vw>=RAMP_LO) return 1-PANE_RATIO+(vw-RAMP_LO)/(RAMP_HI-RAMP_LO)*(PHOTO_MIN-(1-PANE_RATIO));
  if(vw>=RAMP_LO2) return PHOTO_MIN+(vw-RAMP_LO2)/(RAMP_LO-RAMP_LO2)*(0.42-PHOTO_MIN);
  return Math.max(PHOTO_MIN2,1-PANE_RATIO+(vw-RAMP_LO2)/(RAMP_HI-RAMP_LO2)*(PHOTO_MIN2-(1-PANE_RATIO)));
}

function placeCard(pw,vh){
  var cs=Math.min(pw/PANE_W,vh/CONTENT_H);
  var gapL=1*cs,mT=14*cs,mB=13*cs,mR=14*cs;
  var cw=Math.max(CARD_W*cs,pw-gapL-mR);
  var ch=vh-mT-mB;
  var card=document.getElementById('card');
  var cardIn=document.getElementById('cardIn');
  if(!card||!cardIn)return;
  card.style.left=gapL+'px';
  card.style.top=mT+'px';
  card.style.width=cw+'px';
  card.style.height=ch+'px';
  card.style.borderRadius=Math.max(1,26*cs)+'px';
  card.style.borderWidth=Math.max(1,cs)+'px';
  cardIn.style.transform='translate('+((cw-CARD_W*cs)/2)+'px,0) scale('+cs+')';
}

function seatHero(photoW,vh){
  var bandH=vh;
  var imgScale=Math.max(photoW/IMG_W,bandH/IMG_H);
  var s=Math.min(imgScale/IMG_REF_SCALE,photoW*0.92/HERO_W);
  var hero=document.getElementById('hero');
  if(hero)hero.style.transform='scale('+s+')';
}

function layoutLand(){
  clearInline();
  document.documentElement.classList.remove('tabport','stacked');
  var stage=document.getElementById('stage');
  var photo=document.getElementById('photo');
  var pane=document.getElementById('pane');
  var hero=document.getElementById('hero');
  var vw=window.innerWidth,vh=window.innerHeight;
  var pr=photoRatio(vw);
  var photoW=stage?stage.clientWidth*pr:vw*pr;
  if(photo){photo.style.width=pr*100+'%'}
  if(pane){pane.style.left=pr*100+'%'}
  if(hero){hero.style.transform='scale(1)';hero.style.bottom='0'}
  var card=document.getElementById('card');
  if(card){
    var paneW=stage?stage.clientWidth*(1-pr):vw*(1-pr);
    placeCard(paneW,vh);
  }
}

function layoutTabport(){
  clearInline();
  document.documentElement.classList.add('tabport');
  document.documentElement.classList.remove('stacked');
  var vw=window.innerWidth,vh=window.innerHeight;
  var band=Math.round(vh*0.425);
  var sideMargin=Math.round(vw*0.0525);
  var footer=Math.round(vh*0.0297);
  var photo=document.getElementById('photo');
  var scrim=document.getElementById('scrim');
  if(photo){photo.style.height=band+'px';photo.style.width='100%';photo.style.position='relative'}
  if(scrim)scrim.style.display='none';
  var hero=document.getElementById('hero');
  if(hero){
    hero.style.position='relative';
    hero.style.width='auto';
    hero.style.height='auto';
    hero.style.bottom='auto';
    hero.style.transform='none';
    hero.style.display='flex';
    hero.style.flexDirection='column';
    hero.style.padding='0 '+sideMargin+'px';
    hero.style.paddingBottom=Math.round(band*TP.heroBot)+'px';
    hero.style.gap=Math.round(band*TP.heroGap)+'px';
  }
  var badge=document.getElementById('badge');
  if(badge){
    badge.style.position='relative';
    badge.style.left='0';badge.style.top='0';
    badge.style.transform='none';
    var bkh=Math.round(band*TP.badgeH);
    badge.style.height=bkh+'px';
    badge.style.padding='0 '+(Math.round(16*(bkh/37)))+'px 0 '+(Math.round(19*(bkh/37)))+'px';
    badge.style.fontSize=Math.round(13.6*(bkh/37))+'px';
    badge.style.borderRadius='999px';
  }
  var hlWrap=document.getElementById('hlWrap');
  var hl1=document.getElementById('hl1');
  var hl2=document.getElementById('hl2');
  if(hl1){hl1.style.position='relative';hl1.style.left='0';hl1.style.top='0';hl1.style.fontSize=Math.round(band*0.12)+'px';hl1.style.lineHeight='.95';hl1.style.whiteSpace='normal'}
  if(hl2){hl2.style.position='relative';hl2.style.left='0';hl2.style.top='0';hl2.style.fontSize=Math.round(band*0.12)+'px';hl2.style.lineHeight='.95';hl2.style.whiteSpace='normal'}
  if(hlWrap){hlWrap.style.width='auto';hlWrap.style.height='auto';hlWrap.style.gap=Math.round(band*0.02)+'px'}
  var card=document.getElementById('card');
  var cardIn=document.getElementById('cardIn');
  if(card){
    card.style.position='relative';card.style.left='0';card.style.top='0';
    card.style.width='100%';card.style.height='auto';card.style.borderRadius='0';
    card.style.background='#fff';card.style.border='0';card.style.boxShadow='none';
  }
  if(cardIn){
    cardIn.style.position='relative';cardIn.style.inset='0';cardIn.style.transform='none';
    cardIn.style.width='100%';cardIn.style.height='auto';
    cardIn.style.maxWidth='600px';cardIn.style.margin='0 auto';
    cardIn.style.padding='32px 20px';
  }
  var pane=document.getElementById('pane');
  if(pane){pane.style.position='relative';pane.style.left='0';pane.style.width='100%';pane.style.padding='0'}
}

function layoutPhone(){
  clearInline();
  document.documentElement.classList.add('stacked');
  document.documentElement.classList.remove('tabport');
}

function setMode(m){
  if(m==='land') layoutLand();
  else if(m==='tabport') layoutTabport();
  else if(m==='phone') layoutPhone();
}

function layout(){
  var vw=window.innerWidth;
  if(vw<700){setMode('phone');return}
  var ar=window.innerWidth/window.innerHeight;
  if(ar>=51/50) setMode('land');
  else setMode('tabport');
}

var mqLandscape=window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
var mqPortrait=window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

window.addEventListener('resize',layout,{passive:true});
window.addEventListener('orientationchange',layout);
mqLandscape.addEventListener('change',layout);
mqPortrait.addEventListener('change',layout);
document.addEventListener('fonts.ready',layout);
layout();
})();
</script>

<script>
// ─── Entrance Animation ──────────────────────────────────
(function(){
function releaseEntrance(){
  document.documentElement.classList.remove('entry-pending');
  if(window.__entryFallback)clearTimeout(window.__entryFallback);
}
var mq=window.matchMedia('(prefers-reduced-motion:reduce)');
var compact=mq.matches||!Element.prototype.animate;
if(compact){releaseEntrance();return}

function softEase(c){return'cubic-bezier(.22,1,.36,1)'}

var targets=[
  {el:'#card',delay:40,dur:820,easing:'cubic-bezier(.16,1,.3,1)',from:['opacity:0','transform:translateY('+(window.matchMedia('(max-width:699px)').matches?14:12)+'px) scale(.988)']},
  {el:'#badge',delay:120,dur:480,easing:softEase(),from:['transform:translateY(8px)']},
  {el:'#hl1',delay:240,dur:760,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY('+(window.matchMedia('(max-width:699px)').matches?12:16)+'px)','clipPath:inset(100% 0 0 0)']},
  {el:'#hl2',delay:330,dur:760,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY('+(window.matchMedia('(max-width:699px)').matches?12:16)+'px)','clipPath:inset(100% 0 0 0)']},
  {el:'#h1',delay:470,dur:620,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY(10px)']},
  {el:'#sub',delay:570,dur:560,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY(10px)']},
  {el:'#email',delay:720,dur:520,easing:softEase(),from:['transform:translateY(8px)']},
  {el:'#pw',delay:790,dur:520,easing:softEase(),from:['transform:translateY(8px)']},
  {el:'#loginBtn',delay:930,dur:560,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY(8px)']},
  {el:'.divider',delay:1060,dur:440,easing:softEase(),from:['transform:translateY(6px)']},
  {el:'#gBtn',delay:1150,dur:540,easing:'cubic-bezier(.16,1,.3,1)',from:['transform:translateY(8px)']},
  {el:'#bottom',delay:1260,dur:500,easing:softEase(),from:['transform:translateY(6px)']}
];

var animations=[];
Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,650)})]).then(function(){
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      targets.forEach(function(t){
        var el=document.querySelector(t.el);
        if(!el)return;
        var keyframes={opacity:[0,1]};
        t.from.forEach(function(f){
          var parts=f.split(':');
          var prop=parts[0].trim();
          var val=parts.slice(1).join(':').trim().replace(/^\[|\]$/g,'');
          keyframes[prop]=[val,'none'];
          if(prop==='transform')keyframes.transform=[val,'none'];
          if(prop==='clipPath')keyframes.clipPath=[val,'none'];
        });
        var anim=el.animate(keyframes,{delay:t.delay,duration:t.dur,easing:t.easing,fill:'both'});
        animations.push(anim);
      });
      releaseEntrance();
      Promise.allSettled(animations.map(function(a){return a.finished})).then(function(){
        animations.forEach(function(a){a.cancel()});
        animations=[];
        releaseEntrance();
      });
    });
  });
});
})();
</script>
</body>
