[mypy]
python_version = 3.11
strict = True
warn_unused_ignores = True
ignore_missing_imports = True
follow_imports = silent
exclude = ^(dashboard/|test-repo/|benchmark_external)

[mypy-scanner.corpora.*]
ignore_errors = True

[mypy-scanner.corpus.*]
ignore_errors = True

[mypy-scanner.main.*]
ignore_errors = True

[mypy-scanner.collectors.ast_collector.*]
ignore_errors = True

[mypy-scanner.collectors.dep_collector.*]
ignore_errors = True

[mypy-scanner.collectors.registry.*]
ignore_errors = True

[mypy-scanner.collectors.cert_collector.*]
ignore_errors = True

[mypy-backend.*]
ignore_errors = True

[mypy-scripts.a11y_check.*]
ignore_errors = True

[mypy-scripts.benchmark_external.*]
ignore_errors = True

[mypy-scripts.cleanup_stale_scans.*]
ignore_errors = True

[mypy-scripts.calibrate_confidence.*]
ignore_errors = True

[mypy-scripts.verify_compose.*]
ignore_errors = True

[mypy-scripts.evaluate_corpora.*]
ignore_errors = True
