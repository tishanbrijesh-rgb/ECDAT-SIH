name: ECDAT Benchmark

on:
  schedule:
    # Every Sunday at 06:00 UTC.
    - cron: "0 6 * * 0"
  workflow_dispatch:

jobs:
  corpus-evaluation:
    name: Corpus evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Run corpus evaluation
        run: |
          ECC_GATEGUARD=off python scripts/evaluate_corpora.py 2>&1 | tee corpus-results.txt
          sha256sum scanner/corpora/results.json > scanner/corpora/results.json.sha256
      - name: Validate corpus result artifact
        run: python scripts/validate_release_artifacts.py corpus scanner/corpora/results.json --stamp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-evaluation-results
          path: |
            scanner/corpora/results.json
            scanner/corpora/results.json.sha256
            corpus-results.txt
          retention-days: 90

  regression-check:
    name: Precision regression check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Run benchmark tests
        run: python -m pytest tests/test_benchmark.py -v
      - name: Run regression detection tests
        run: python -m pytest tests/test_discovery_regressions.py -v
      - name: Run corpus detector tests
        run: python -m pytest tests/test_corpus_detectors.py -v

  calibration-update:
    name: Calibration update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - name: Rerun confidence calibration
        run: python scripts/calibrate_confidence.py
      - name: Validate calibration artifact
        run: python scripts/validate_release_artifacts.py calibration backend/services/calibration_params.json --stamp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-params
          path: backend/services/calibration_params.json
          retention-days: 30

  baseline-comparison:
    name: Compare against precision baseline
    runs-on: ubuntu-latest
    needs: corpus-evaluation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install --require-hashes -r backend/requirements.lock
      - uses: actions/download-artifact@v4
        with:
          name: corpus-evaluation-results
          path: scanner/corpora
      - name: Run evaluation v2 tests
        run: python -m pytest tests/test_evaluation_v2.py -v
      - name: Check precision baseline
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          results_path = Path('scanner/corpora/results.json')
          if results_path.exists():
              data = json.loads(results_path.read_text())
              precision = data.get('overall', {}).get('micro_precision')
              if precision is None:
                  print('FAIL: corpus result does not contain overall.micro_precision')
                  sys.exit(1)
              # Fail if overall precision drops below 50%.
              if precision < 0.50:
                  print(f'FAIL: precision {precision:.3f} below baseline 0.50')
                  sys.exit(1)
              print(f'OK: precision {precision:.3f}')
          else:
              print('FAIL: no corpus results.json found')
              sys.exit(1)
          "
