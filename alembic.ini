# Minimal Alembic config — env.py overrides sqlalchemy.url from DATABASE_URL env var.
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./ecdat_alembic_temp.db

[post_write_hooks]
# noop

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
