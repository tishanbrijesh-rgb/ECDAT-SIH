services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ecdat
      POSTGRES_DB: ecdat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecdat:ecdat@db:5432/ecdat
      SCANNER_PATH: /app
      ECDAT_ALLOWED_SCAN_ROOTS: /test-repo
      ECDAT_CORS_ORIGINS: http://localhost:3000
      ECDAT_DEMO_PASSWORD: ${ECDAT_DEMO_PASSWORD:-ecdat-demo}
      ECDAT_TOKEN_SECRET: ${ECDAT_TOKEN_SECRET:-local-sih-demo-secret-change-me}
    volumes:
      - ./scanner:/app/scanner:ro
      - ./test-repo:/test-repo:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
