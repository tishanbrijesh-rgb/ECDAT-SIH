services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecdat
      POSTGRES_PASSWORD: ${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}
      POSTGRES_DB: ecdat
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecdat"]
      interval: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecdat:${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}@db:5432/ecdat
      SCANNER_PATH: /app
      ECDAT_ALLOWED_SCAN_ROOTS: /test-repo
      ECDAT_CORS_ORIGINS: http://localhost:3000
      ECDAT_ALLOW_ROLE_HEADER: "false"
      ECDAT_SCAN_TIMEOUT_SECONDS: ${ECDAT_SCAN_TIMEOUT_SECONDS:-300}
      ECDAT_MAX_FILE_BYTES: ${ECDAT_MAX_FILE_BYTES:-8388608}
      ECDAT_AUTO_CREATE_TABLES: "false"
      ECDAT_MAX_SCAN_FILES: ${ECDAT_MAX_SCAN_FILES:-100000}
      ECDAT_USERS_JSON: ${ECDAT_USERS_JSON:?Configure ECDAT_USERS_JSON}
      ECDAT_TOKEN_SECRET: ${ECDAT_TOKEN_SECRET:?Configure ECDAT_TOKEN_SECRET}
    volumes:
      - ./scanner:/app/scanner:ro
      - ./test-repo:/test-repo:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://ecdat:${ECDAT_DB_PASSWORD:?Configure ECDAT_DB_PASSWORD}@db:5432/ecdat
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
